schema_version: 1
workspaces:
  review:
    default_route: chat
    routes:
      chat:
        tiers:
          - targets:
              - id: reviewer-local
                model: local
                protocol: chat_completions
                connection:
                  custom:
                    base_url: http://127.0.0.1:9/v1
                    auth:
                      header:
                        name: x-review-no-auth
                        credential: env:SWOBU_REVIEW_NO_CREDENTIAL
